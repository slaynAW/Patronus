# Compile, teste et publie l'application Android, l'application Windows et l'agent PC.
#
# - Chaque push / pull request : tests, lint, APK, application Windows et binaires de l'agent (onglet « Actions »).
# - Push sur une branche : la pré-version « dev » est remplacée (APK téléchargeable depuis le téléphone).
# - Version officielle : onglet Actions → Build → « Run workflow » en indiquant le numéro (ex. 1.0.0),
#   ou push d'un tag « vX.Y.Z ». Le tag et la Release GitHub sont créés automatiquement.
name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Version officielle à publier (ex. 1.0.0). Laisser vide pour un simple build de développement."
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Code de version croissant : chaque APK peut s'installer par-dessus le précédent.
  WOL_VERSION_CODE: ${{ github.run_number }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      official: ${{ steps.v.outputs.official }}
      agent: ${{ steps.v.outputs.agent }}
    steps:
      - uses: actions/checkout@v6
      - id: v
        env:
          RELEASE_INPUT: ${{ inputs.release }}
        run: |
          base=$(grep '^wol.versionName=' gradle.properties | cut -d= -f2)
          official=false
          if [[ -n "$RELEASE_INPUT" ]]; then
            if [[ ! "$RELEASE_INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error title=Version::« $RELEASE_INPUT » n'est pas un numéro de version valide (format attendu : 1.2.3)."
              exit 1
            fi
            name="$RELEASE_INPUT"; official=true
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF_NAME#v}"; official=true
          else
            name="${base}-dev.${GITHUB_RUN_NUMBER}"
          fi
          # L'agent a son propre numéro (première section de agent/NOUVEAUTES.md) : il ne change que
          # lorsque l'agent change, et c'est lui que les agents installés comparent au leur.
          agent=$(awk '/^## [0-9]+\.[0-9]+\.[0-9]+[[:space:]]*$/ { print $2; exit }' agent/NOUVEAUTES.md)
          if [[ -z "$agent" ]]; then
            echo "::error title=Agent::agent/NOUVEAUTES.md ne contient pas de section « ## X.Y.Z »."
            exit 1
          fi
          [[ "$official" == true ]] || agent="${agent}-dev.${GITHUB_RUN_NUMBER}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "official=$official" >> "$GITHUB_OUTPUT"
          echo "agent=$agent" >> "$GITHUB_OUTPUT"
          echo "Version : $name (code $WOL_VERSION_CODE, officielle : $official) ; agent $agent"

  agent:
    name: Agent PC (tests + binaires)
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Analyse statique (tous les systèmes)
        run: |
          for os in linux windows darwin; do GOOS=$os go vet ./...; done
      - name: Tests
        run: go test -race ./...
      - name: Binaires
        env:
          VERSION: ${{ needs.version.outputs.agent }}
        run: |
          mkdir -p ../dist
          build() { # os arch [suffixe] [variables]
            echo "→ $1/$2"
            env CGO_ENABLED=0 GOOS=$1 GOARCH=$2 $4 go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
              -o "../dist/wol-agent-$1-$2$3" .
          }
          build windows amd64 .exe
          build windows arm64 .exe
          build linux amd64
          build linux arm64
          build linux arm "" GOARM=7
          build darwin amd64
          build darwin arm64
          ls -l ../dist
      - uses: actions/upload-artifact@v6
        with:
          name: agent
          path: dist/
          if-no-files-found: error

  agent-windows:
    name: Agent PC (tests Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - run: go test ./...
      # Service réellement installé, puis mis à jour par lui-même depuis un faux serveur de versions
      # (manifeste signé par une clé de test) : recherche, téléchargement, remplacement, redémarrage.
      - name: Mise à jour de bout en bout
        run: go test -tags e2e -count=1 -run TestUpdateEndToEnd -v -timeout 10m .

  desktop:
    name: Application Windows (tests + exécutables)
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Analyse statique (Windows x64 / ARM64, Linux)
        run: |
          GOOS=windows GOARCH=amd64 go vet ./...
          GOOS=windows GOARCH=arm64 go vet ./...
          go vet ./...
      # Le vrai agent tourne en mode simulation : test de bout en bout du client Windows.
      - name: Agent de test (simulation)
        run: |
          (cd ../agent && go build -o "$RUNNER_TEMP/wol-agent" .)
          key=$(openssl rand 32 | basenc --base64url | tr -d '=')
          echo "::add-mask::$key"
          cat > "$RUNNER_TEMP/agent.json" <<JSON
          {"name":"ci","port":19771,"key":"$key","allow":["127.0.0.0/8"],"commands":["status","shutdown","reboot","sleep"]}
          JSON
          nohup "$RUNNER_TEMP/wol-agent" run --config "$RUNNER_TEMP/agent.json" --dry-run > "$RUNNER_TEMP/agent.log" 2>&1 &
          echo "WOL_E2E_PORT=19771" >> "$GITHUB_ENV"
          echo "WOL_E2E_KEY=$key" >> "$GITHUB_ENV"
      - name: Tests
        run: |
          go test -race -count=1 ./...
          go test -count=1 -run EndToEnd -v ./internal/agentclient/ | tee "$RUNNER_TEMP/e2e.txt"
          grep -q -- '--- PASS: TestEndToEndWithRealAgent' "$RUNNER_TEMP/e2e.txt"
      - name: Exécutables (icône, manifeste, version)
        env:
          VERSION: ${{ needs.version.outputs.name }}
        run: |
          # Numéro de fichier Windows : X.Y.Z.<numéro de build>.
          numeric="$(echo "$VERSION" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+').${GITHUB_RUN_NUMBER}"
          go run github.com/tc-hib/go-winres@v0.3.3 make --in winres/winres.json --arch amd64,arm64 \
            --product-version "$numeric" --file-version "$numeric"
          # Identifiant public de l'application OAuth GitHub (connexion du partage), comme pour Android.
          client_id=$(grep '^wol.githubClientId=' ../gradle.properties | cut -d= -f2)
          mkdir -p ../dist
          for arch in amd64 arm64; do
            label=$([ "$arch" = amd64 ] && echo x64 || echo arm64)
            CGO_ENABLED=0 GOOS=windows GOARCH=$arch go build -trimpath \
              -ldflags "-H windowsgui -s -w -X main.version=$VERSION -X main.buildCode=$WOL_VERSION_CODE -X main.githubClientID=$client_id" \
              -o "../dist/Patronus-Windows-${VERSION}-${label}.exe" .
          done
          ls -l ../dist
      - uses: actions/upload-artifact@v6
        with:
          name: desktop
          path: dist/
          if-no-files-found: error

  desktop-windows:
    name: Application Windows (tests sous Windows + démarrage réel)
    needs: desktop
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      # Chiffrement DPAPI, ping, détection des cartes réseau, refus de connexion rapide...
      - name: Tests
        working-directory: desktop
        run: go test -count=1 ./...
      - uses: actions/download-artifact@v7
        with:
          name: desktop
          path: dist
      # Lance le vrai .exe : fenêtre WebView2, chargement de l'interface, échange avec le moteur.
      - name: Démarrage de l'application (autotest)
        shell: pwsh
        run: |
          $result = Join-Path $env:RUNNER_TEMP "selftest.json"
          $env:WOL_SELFTEST = $result
          $env:WOL_DATA_DIR = Join-Path $env:RUNNER_TEMP "wol-data"
          $exe = Get-ChildItem dist -Filter "Patronus-Windows-*-x64.exe" | Select-Object -First 1
          $p = Start-Process -FilePath $exe.FullName -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "L'application n'a pas terminé son autotest en 2 minutes." }
          if (Test-Path $result) { Get-Content $result } else { throw "Aucun résultat d'autotest." }
          Get-Content (Join-Path $env:WOL_DATA_DIR "wakeonlan.log") -ErrorAction SilentlyContinue
          if ((Get-Content $result -Raw) -notmatch '"ok":true') { throw "Échec de l'autotest de démarrage." }

  android:
    name: Application Android
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      WOL_VERSION_NAME: ${{ needs.version.outputs.name }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Valide aussi la somme de contrôle du gradle-wrapper.jar (protection de la chaîne de build).
      - uses: gradle/actions/setup-gradle@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      # Le vrai agent tourne en mode simulation pour le test de bout en bout (AgentEndToEndTest).
      - name: Agent de test (simulation)
        run: |
          (cd agent && go build -o "$RUNNER_TEMP/wol-agent" .)
          key=$(openssl rand 32 | basenc --base64url | tr -d '=')
          echo "::add-mask::$key"
          cat > "$RUNNER_TEMP/agent.json" <<JSON
          {"name":"ci","port":19770,"key":"$key","allow":["127.0.0.0/8"],"commands":["status","shutdown","reboot","sleep"]}
          JSON
          nohup "$RUNNER_TEMP/wol-agent" run --config "$RUNNER_TEMP/agent.json" --dry-run > "$RUNNER_TEMP/agent.log" 2>&1 &
          echo "WOL_E2E_PORT=19770" >> "$GITHUB_ENV"
          echo "WOL_E2E_KEY=$key" >> "$GITHUB_ENV"

      - name: Clé de signature (secrets du dépôt)
        env:
          KEYSTORE_BASE64: ${{ secrets.WOL_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.WOL_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ vars.WOL_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            # Tolère les espaces / retours à la ligne ajoutés par un copier-coller.
            printf '%s' "$KEYSTORE_BASE64" | tr -d ' \t\r\n' | base64 -d > "$RUNNER_TEMP/release.p12" || {
              echo "::error title=Signature::Le secret WOL_KEYSTORE_BASE64 n'est pas un contenu Base64 valide (recopiez tout le fichier WOL_KEYSTORE_BASE64.txt)."
              exit 1
            }
            password=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d ' \t\r\n')
            if ! keytool -list -keystore "$RUNNER_TEMP/release.p12" -storetype PKCS12 -storepass "$password" \
                 -alias "${KEY_ALIAS:-wakeonlan}" > /dev/null 2>&1; then
              echo "::error title=Signature::Clé illisible : vérifiez le secret WOL_KEYSTORE_PASSWORD (contenu exact de WOL_KEYSTORE_PASSWORD.txt)."
              exit 1
            fi
            echo "WOL_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
            echo "SIGNING=release" >> "$GITHUB_ENV"
            echo "Clé de signature définitive chargée."
          else
            echo "::warning title=Signature::Secret WOL_KEYSTORE_BASE64 absent : APK signé avec une clé temporaire. Voir docs/SIGNATURE.md"
            echo "SIGNING=temporaire" >> "$GITHUB_ENV"
          fi

      - name: Tests, lint et APK
        env:
          WOL_KEYSTORE_PASSWORD: ${{ secrets.WOL_KEYSTORE_PASSWORD }}
          WOL_KEY_ALIAS: ${{ vars.WOL_KEY_ALIAS }}
        # --rerun : le test de bout en bout doit vraiment interroger l'agent (pas de résultat en cache).
        run: ./gradlew --stacktrace :core:test --rerun :app:lintRelease :app:assembleRelease

      - name: Avertissements lint
        run: cat app/build/reports/lint-results-release.txt 2>/dev/null || echo "Aucun rapport texte"

      # Garde-fou : échoue si R8 casse les composants du lecteur de QR code (plantage au scan).
      - name: Contrôle R8 (composants chargés par réflexion)
        run: .github/scripts/check-r8-registrars.sh --strict

      - name: Vérification du test de bout en bout
        run: |
          grep -q 'tests="3" skipped="0" failures="0" errors="0"' \
            core/build/test-results/test/TEST-io.github.slaynaw.wakeonlan.core.AgentEndToEndTest.xml
          cat "$RUNNER_TEMP/agent.log"

      - name: Préparation de l'APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Patronus-${WOL_VERSION_NAME}.apk"
          echo "$SIGNING" > dist/signing.txt
          ls -l dist

      - uses: actions/upload-artifact@v6
        with:
          name: apk
          path: dist/
          if-no-files-found: error

      # Captures d'écran des écrans principaux, rendues sans émulateur (Robolectric) avec des données
      # d'exemple : contrôle visuel de l'interface (ne bloque pas la publication).
      - name: Captures d'écran de l'interface
        continue-on-error: true
        run: ./gradlew --stacktrace :app:testDebugUnitTest --tests '*ScreenshotTest*'

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: captures-android
          path: |
            app/build/captures/android/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Rapports (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: rapports
          path: |
            core/build/reports/
            app/build/reports/
          if-no-files-found: ignore

  release:
    name: Publication
    needs: [version, agent, agent-windows, desktop, desktop-windows, android]
    # Push ou lancement manuel (« Run workflow ») ; jamais pour une pull request.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.name }}
      AGENT_VERSION: ${{ needs.version.outputs.agent }}
    steps:
      - uses: actions/checkout@v6
      # Uniquement les fichiers publiés (pas les captures d'écran ni les rapports de test).
      - uses: actions/download-artifact@v7
        with:
          name: apk
          path: dist
      - uses: actions/download-artifact@v7
        with:
          name: desktop
          path: dist
      - uses: actions/download-artifact@v7
        with:
          name: agent
          path: dist
      - name: Notes de version
        run: |
          signing=$(cat dist/signing.txt); rm dist/signing.txt
          (cd dist && sha256sum * > SHA256SUMS.txt)
          {
            echo "## 📱 Installer l'application"
            echo "Depuis le téléphone, téléchargez **Patronus-${VERSION}.apk** ci-dessous puis ouvrez-le"
            echo "(autorisez l'installation depuis le navigateur si Android le demande)."
            echo
            if [ "$signing" != "release" ]; then
              echo "> ⚠️ APK signé avec une **clé temporaire** (secrets de signature non configurés) :"
              echo "> pour installer une version suivante, il faudra désinstaller celle-ci (exportez d'abord votre configuration)."
              echo "> Voir [docs/SIGNATURE.md](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/docs/SIGNATURE.md)."
              echo
            fi
            echo "## 🖥️ Application Windows (mêmes fonctions que l'application Android)"
            echo "Téléchargez **Patronus-Windows-${VERSION}-x64.exe** (ou \`-arm64.exe\` pour un PC ARM) et lancez-le :"
            echo "aucune installation, un seul fichier. Windows 10/11 (composant WebView2, déjà présent)."
            echo "Au premier lancement, SmartScreen peut afficher « Windows a protégé votre ordinateur » :"
            echo "*Informations complémentaires* → *Exécuter quand même*."
            echo
            echo "## 💻 Agent PC ${AGENT_VERSION} (facultatif, pour éteindre à distance)"
            echo "- **Windows** : \`wol-agent-windows-amd64.exe\` → double-clic → accepter l'invite administrateur → scanner le QR code."
            echo "- **Linux** : \`chmod +x wol-agent-linux-amd64 && sudo ./wol-agent-linux-amd64 install\`"
            echo "- **macOS** : \`chmod +x wol-agent-darwin-arm64 && sudo ./wol-agent-darwin-arm64 install\`"
            echo
            echo "Sommes de contrôle : \`SHA256SUMS.txt\`. Commit : ${GITHUB_SHA}."
          } > notes.md
          ls -l dist
      # Manifeste des mises à jour intégrées (nouveautés + empreintes), signé avec la clé de l'APK ;
      # joint aux versions officielles seulement. Voir docs/MISES-A-JOUR.md.
      - name: Manifeste de mise à jour
        env:
          OFFICIAL: ${{ needs.version.outputs.official }}
          KEYSTORE_BASE64: ${{ secrets.WOL_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.WOL_KEYSTORE_PASSWORD }}
        run: bash .github/scripts/update-manifest.sh
      - name: Version officielle (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Patronus $VERSION" --notes-file notes.md
      - name: Version officielle (lancement manuel)
        if: github.event_name == 'workflow_dispatch' && needs.version.outputs.official == 'true'
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "::error title=Version::La version v$VERSION existe déjà : choisissez un autre numéro."
            exit 1
          fi
          # Crée le tag vX.Y.Z sur le commit compilé, puis la Release avec l'APK et les agents.
          gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" --title "Patronus $VERSION" --notes-file notes.md
      - name: Pré-version de développement
        if: startsWith(github.ref, 'refs/heads/') && needs.version.outputs.official != 'true'
        run: |
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev dist/* --prerelease --target "$GITHUB_SHA" \
            --title "Version de développement ${VERSION} (${GITHUB_REF_NAME})" --notes-file notes.md
