# Compile, teste et publie l'application Android et l'agent PC.
#
# - Chaque push : tests + lint + APK (+ binaires de l'agent) disponibles en « artifacts ».
# - Push sur une branche : la pré-version « dev » est mise à jour (APK téléchargeable depuis le téléphone).
# - Tag « vX.Y.Z » : publication d'une version officielle (Release GitHub).
name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Même nom de variable que dans app/build.gradle.kts.
  WOL_VERSION_CODE: ${{ github.run_number }}

jobs:
  android:
    name: Application Android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Valide aussi la somme de contrôle du gradle-wrapper.jar (protection de la chaîne de build).
      - uses: gradle/actions/setup-gradle@v6

      - name: Calcul de la version
        run: |
          base=$(grep '^wol.versionName=' gradle.properties | cut -d= -f2)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name="${base}-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "WOL_VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "Version : $name (code $WOL_VERSION_CODE)"

      - name: Clé de signature (secrets du dépôt)
        env:
          KEYSTORE_BASE64: ${{ secrets.WOL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "WOL_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
            echo "SIGNING=release" >> "$GITHUB_ENV"
          else
            echo "::warning title=Signature::Secret WOL_KEYSTORE_BASE64 absent : APK signé avec une clé temporaire. Voir docs/SIGNATURE.md"
            echo "SIGNING=temporaire" >> "$GITHUB_ENV"
          fi

      - name: Tests, lint et APK
        env:
          WOL_KEYSTORE_PASSWORD: ${{ secrets.WOL_KEYSTORE_PASSWORD }}
        run: ./gradlew --stacktrace :core:test :app:lintRelease :app:assembleRelease

      - name: Préparation de l'APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/WakeOnLan-${WOL_VERSION_NAME}.apk"
          echo "$SIGNING" > dist/signing.txt
          ls -l dist

      - uses: actions/upload-artifact@v6
        with:
          name: apk
          path: dist/
          if-no-files-found: error

      - name: Rapports (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: rapports
          path: |
            core/build/reports/
            app/build/reports/
          if-no-files-found: ignore
