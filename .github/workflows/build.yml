# Compile, teste et publie l'application Android, l'application Windows et l'agent PC.
#
# - Chaque push / pull request : tests, lint, APK, application Windows, binaires de l'agent, failles
#   connues des dépendances et inventaire des composants (onglet « Actions »).
# - Push sur une branche : la pré-version « dev » est remplacée (APK signé avec une clé de test).
# - Version officielle : onglet Actions → Build → « Run workflow » en indiquant le numéro (ex. 1.0.0),
#   ou push d'un tag « vX.Y.Z ». Le job « Publication officielle » attend ta validation
#   (environnement « publication ») : lui seul reçoit la clé de signature. Il signe l'APK et le
#   manifeste de mise à jour, atteste la provenance de chaque fichier, puis crée le tag et la Release.
#
# Chaîne de production : actions épinglées par empreinte de commit (tenues à jour par Dependabot),
# jeton en lecture seule par défaut, aucun secret hors du job de publication. Voir SECURITY.md.
name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Version officielle à publier (ex. 1.0.0). Laisser vide pour un simple build de développement."
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  # Une publication officielle a son propre groupe : un push sur la branche ne l'annule pas pendant
  # qu'elle attend ta validation.
  group: build-${{ github.ref }}-${{ inputs.release }}
  cancel-in-progress: true

env:
  # Code de version croissant : chaque APK peut s'installer par-dessus le précédent.
  WOL_VERSION_CODE: ${{ github.run_number }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      official: ${{ steps.v.outputs.official }}
      agent: ${{ steps.v.outputs.agent }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        env:
          RELEASE_INPUT: ${{ inputs.release }}
        run: |
          base=$(grep '^wol.versionName=' gradle.properties | cut -d= -f2)
          official=false
          if [[ -n "$RELEASE_INPUT" ]]; then
            if [[ ! "$RELEASE_INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error title=Version::« $RELEASE_INPUT » n'est pas un numéro de version valide (format attendu : 1.2.3)."
              exit 1
            fi
            name="$RELEASE_INPUT"; official=true
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF_NAME#v}"; official=true
          else
            name="${base}-dev.${GITHUB_RUN_NUMBER}"
          fi
          # L'agent a son propre numéro (première section de agent/NOUVEAUTES.md) : il ne change que
          # lorsque l'agent change, et c'est lui que les agents installés comparent au leur.
          agent=$(awk '/^## [0-9]+\.[0-9]+\.[0-9]+[[:space:]]*$/ { print $2; exit }' agent/NOUVEAUTES.md)
          if [[ -z "$agent" ]]; then
            echo "::error title=Agent::agent/NOUVEAUTES.md ne contient pas de section « ## X.Y.Z »."
            exit 1
          fi
          [[ "$official" == true ]] || agent="${agent}-dev.${GITHUB_RUN_NUMBER}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "official=$official" >> "$GITHUB_OUTPUT"
          echo "agent=$agent" >> "$GITHUB_OUTPUT"
          echo "Version : $name (code $WOL_VERSION_CODE, officielle : $official) ; agent $agent"

  agent:
    name: Agent PC (tests + binaires)
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
          # Version officielle compilée sans cache : rien d'un build précédent ne peut s'y glisser.
          cache: ${{ needs.version.outputs.official != 'true' }}
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Analyse statique (tous les systèmes)
        run: |
          for os in linux windows darwin; do GOOS=$os go vet ./...; done
      - name: Tests
        run: go test -race ./...
      - name: Vecteurs wolagent/2 (recalcul indépendant, Python et OpenSSL)
        run: python3 -I ../.github/scripts/check-v2-vectors.py ../protocol/v2-vectors.json
      - name: Binaires
        env:
          VERSION: ${{ needs.version.outputs.agent }}
        run: |
          mkdir -p ../dist
          build() { # os arch [suffixe] [variables]
            echo "→ $1/$2"
            env CGO_ENABLED=0 GOOS=$1 GOARCH=$2 $4 go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
              -o "../dist/wol-agent-$1-$2$3" .
          }
          build windows amd64 .exe
          build windows arm64 .exe
          build linux amd64
          build linux arm64
          build linux arm "" GOARM=7
          build darwin amd64
          build darwin arm64
          ls -l ../dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent
          path: dist/
          if-no-files-found: error

  agent-windows:
    name: Agent PC (tests Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - run: go test ./...
      # Fiche du PC lue sur une vraie machine Windows (SMBIOS, registre, WMI), affichée en détail.
      - name: Fiche du PC sous Windows
        run: go test -count=1 -v -run 'TestWindowsFirmwareTable|TestReadReal' ./internal/specs/
      # Service réellement installé, puis mis à jour par lui-même depuis un faux serveur de versions
      # (manifeste signé par une clé de test) : recherche, téléchargement, remplacement, redémarrage.
      - name: Mise à jour de bout en bout
        run: go test -tags e2e -count=1 -run TestUpdateEndToEnd -v -timeout 10m .

  desktop:
    name: Application Windows (tests + exécutables)
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
          # Version officielle compilée sans cache : rien d'un build précédent ne peut s'y glisser.
          cache: ${{ needs.version.outputs.official != 'true' }}
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Analyse statique (Windows x64 / ARM64, Linux)
        run: |
          GOOS=windows GOARCH=amd64 go vet ./...
          GOOS=windows GOARCH=arm64 go vet ./...
          go vet ./...
      # Le vrai agent tourne en mode simulation : test de bout en bout du client Windows.
      - name: Agent de test (simulation)
        run: |
          (cd ../agent && go build -o "$RUNNER_TEMP/wol-agent" .)
          key=$(openssl rand 32 | basenc --base64url | tr -d '=')
          echo "::add-mask::$key"
          cat > "$RUNNER_TEMP/agent.json" <<JSON
          {"name":"ci","port":19771,"key":"$key","allow":["127.0.0.0/8"],"commands":["status","shutdown","reboot","sleep"]}
          JSON
          nohup "$RUNNER_TEMP/wol-agent" run --config "$RUNNER_TEMP/agent.json" --dry-run > "$RUNNER_TEMP/agent.log" 2>&1 &
          echo "WOL_E2E_PORT=19771" >> "$GITHUB_ENV"
          echo "WOL_E2E_KEY=$key" >> "$GITHUB_ENV"
      - name: Tests
        run: |
          go test -race -count=1 ./...
          go test -count=1 -run EndToEnd -v ./internal/agentclient/ ./internal/app/ | tee "$RUNNER_TEMP/e2e.txt"
          for t in TestEndToEndWithRealAgent TestEndToEndV2WithRealAgent TestEndToEndUpgradeWithRealAgent; do
            grep -q -- "--- PASS: $t " "$RUNNER_TEMP/e2e.txt" || { echo "::error::$t n'a pas tourné"; exit 1; }
          done
          cat "$RUNNER_TEMP/agent.log"
      - name: Exécutables (icône, manifeste, version)
        env:
          VERSION: ${{ needs.version.outputs.name }}
        run: |
          # Numéro de fichier Windows : X.Y.Z.<numéro de build>.
          numeric="$(echo "$VERSION" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+').${GITHUB_RUN_NUMBER}"
          go run github.com/tc-hib/go-winres@v0.3.3 make --in winres/winres.json --arch amd64,arm64 \
            --product-version "$numeric" --file-version "$numeric"
          # Identifiant public de l'application OAuth GitHub (connexion du partage), comme pour Android.
          client_id=$(grep '^wol.githubClientId=' ../gradle.properties | cut -d= -f2)
          mkdir -p ../dist
          for arch in amd64 arm64; do
            label=$([ "$arch" = amd64 ] && echo x64 || echo arm64)
            CGO_ENABLED=0 GOOS=windows GOARCH=$arch go build -trimpath \
              -ldflags "-H windowsgui -s -w -X main.version=$VERSION -X main.buildCode=$WOL_VERSION_CODE -X main.githubClientID=$client_id" \
              -o "../dist/Patronus-Windows-${VERSION}-${label}.exe" .
          done
          ls -l ../dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop
          path: dist/
          if-no-files-found: error

  desktop-windows:
    name: Application Windows (tests sous Windows + démarrage réel)
    needs: desktop
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      # Chiffrement DPAPI, ping, détection des cartes réseau, refus de connexion rapide...
      - name: Tests
        working-directory: desktop
        run: go test -count=1 ./...
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop
          path: dist
      # Lance le vrai .exe : fenêtre WebView2, chargement de l'interface, échange avec le moteur.
      - name: Démarrage de l'application (autotest)
        shell: pwsh
        run: |
          $result = Join-Path $env:RUNNER_TEMP "selftest.json"
          $env:WOL_SELFTEST = $result
          $env:WOL_DATA_DIR = Join-Path $env:RUNNER_TEMP "wol-data"
          $exe = Get-ChildItem dist -Filter "Patronus-Windows-*-x64.exe" | Select-Object -First 1
          $p = Start-Process -FilePath $exe.FullName -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "L'application n'a pas terminé son autotest en 2 minutes." }
          if (Test-Path $result) { Get-Content $result } else { throw "Aucun résultat d'autotest." }
          if ((Get-Content $result -Raw) -notmatch '"ok":true') { throw "Échec de l'autotest de démarrage." }
          # Journal de diagnostic : créé (clé protégée par DPAPI) et jamais écrit en clair.
          $journal = Join-Path $env:WOL_DATA_DIR "diagnostics\journal-0.log"
          if (-not (Test-Path (Join-Path $env:WOL_DATA_DIR "diagnostics\journal.key"))) { throw "Clé du journal de diagnostic absente." }
          if (-not (Test-Path $journal)) { throw "Journal de diagnostic absent." }
          if ((Get-Content $journal -Raw -Encoding utf8) -match "démarrage|Patronus") { throw "Journal de diagnostic écrit en clair." }
          Write-Host "Journal de diagnostic : $((Get-Content $journal).Count) évènement(s) chiffré(s)"

  android:
    name: Application Android
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      WOL_VERSION_NAME: ${{ needs.version.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      # Valide aussi la somme de contrôle du gradle-wrapper.jar (protection de la chaîne de build).
      # Cache « basic » : code libre (MIT), au lieu du composant fermé utilisé par défaut.
      # Version officielle compilée sans cache : rien d'un build précédent ne peut s'y glisser.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-disabled: ${{ needs.version.outputs.official == 'true' }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
          cache: ${{ needs.version.outputs.official != 'true' }}

      # Le vrai agent tourne en mode simulation pour les tests de bout en bout (AgentEndToEndTest,
      # Wolagent2EndToEndTest).
      - name: Agent de test (simulation)
        run: |
          (cd agent && go build -o "$RUNNER_TEMP/wol-agent" .)
          key=$(openssl rand 32 | basenc --base64url | tr -d '=')
          echo "::add-mask::$key"
          cat > "$RUNNER_TEMP/agent.json" <<JSON
          {"name":"ci","port":19770,"key":"$key","allow":["127.0.0.0/8"],"commands":["status","shutdown","reboot","sleep"]}
          JSON
          nohup "$RUNNER_TEMP/wol-agent" run --config "$RUNNER_TEMP/agent.json" --dry-run > "$RUNNER_TEMP/agent.log" 2>&1 &
          echo "WOL_E2E_PORT=19770" >> "$GITHUB_ENV"
          echo "WOL_E2E_KEY=$key" >> "$GITHUB_ENV"
          # Identité de l'agent (créée à son démarrage) : wolagent/2 administré comme par wol-agent sur le PC.
          echo "WOL_E2E_IDENTITY=$RUNNER_TEMP/identity.key" >> "$GITHUB_ENV"

      # Aucune clé de signature ici : l'APK est signé avec une clé de test. Seul le job « Publication
      # officielle » reçoit la clé définitive, après validation (docs/SIGNATURE.md).
      - name: Tests, lint et APK
        # --rerun : le test de bout en bout doit vraiment interroger l'agent (pas de résultat en cache).
        run: ./gradlew --stacktrace :core:test --rerun :app:lintRelease :app:assembleRelease

      - name: Avertissements lint
        run: cat app/build/reports/lint-results-release.txt 2>/dev/null || echo "Aucun rapport texte"

      # Garde-fou : échoue si R8 casse les composants du lecteur de QR code (plantage au scan).
      - name: Contrôle R8 (composants chargés par réflexion)
        run: .github/scripts/check-r8-registrars.sh --strict

      - name: Vérification du test de bout en bout
        run: |
          grep -q 'tests="4" skipped="0" failures="0" errors="0"' \
            core/build/test-results/test/TEST-io.github.slaynaw.wakeonlan.core.AgentEndToEndTest.xml
          grep -q 'tests="3" skipped="0" failures="0" errors="0"' \
            core/build/test-results/test/TEST-io.github.slaynaw.wakeonlan.core.Wolagent2EndToEndTest.xml
          cat "$RUNNER_TEMP/agent.log"

      # Rejoue la signature de publication (même script, même outil) avec une clé jetable : un
      # problème de signature se voit à chaque build, pas le jour d'une version officielle.
      - name: Signature de publication (essai avec une clé jetable)
        run: |
          KEYSTORE_PASSWORD=$(openssl rand -hex 24)
          export KEYSTORE_PASSWORD
          keytool -genkeypair -keystore "$RUNNER_TEMP/essai.p12" -storetype PKCS12 -alias essai \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
            -keyalg RSA -keysize 2048 -validity 1 -dname "CN=Essai" 2>/dev/null
          bash .github/scripts/sign-apk.sh app/build/outputs/apk/release/app-release.apk \
            "$RUNNER_TEMP/essai.apk" "$RUNNER_TEMP/essai.p12" essai

      - name: Préparation de l'APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Patronus-${WOL_VERSION_NAME}.apk"
          ls -l dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apk
          path: dist/
          if-no-files-found: error

      # Captures d'écran des écrans principaux, rendues sans émulateur (Robolectric) avec des données
      # d'exemple : contrôle visuel de l'interface (ne bloque pas la publication).
      - name: Captures d'écran de l'interface
        continue-on-error: true
        run: ./gradlew --stacktrace :app:testDebugUnitTest --tests '*ScreenshotTest*'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: captures-android
          path: |
            app/build/captures/android/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Rapports (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rapports
          path: |
            core/build/reports/
            app/build/reports/
          if-no-files-found: ignore

  # Outils tiers d'analyse et d'inventaire, à l'écart des jobs qui produisent les fichiers publiés :
  # ils ne peuvent pas les modifier, et les caches restent en lecture seule (pas de cache empoisonné
  # pour les builds suivants).
  deps:
    name: Dépendances (failles connues, inventaire)
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.version.outputs.name }}
      AGENT_VERSION: ${{ needs.version.outputs.agent }}
      WOL_VERSION_NAME: ${{ needs.version.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache: false
      - name: Outils (versions épinglées)
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          GOBIN="$RUNNER_TEMP/bin" go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # Failles publiées dans la base de Go et réellement atteignables depuis le code, pour chaque
      # système visé. Une faille de la bibliothèque standard se corrige en relevant la ligne
      # « toolchain » des deux go.mod.
      - name: Failles connues (govulncheck)
        run: |
          for os in linux windows darwin; do
            echo "::group::Agent ($os)"
            (cd agent && GOOS=$os govulncheck ./...)
            echo "::endgroup::"
          done
          echo "::group::Application Windows"
          (cd desktop && GOOS=windows govulncheck ./...)
          echo "::endgroup::"
      - name: Inventaire des composants (agent et application Windows)
        run: |
          mkdir -p dist
          bash .github/scripts/sbom-go.sh agent "dist/wol-agent-${AGENT_VERSION}.cdx.json" \
            "github.com/slaynaw/wakeonlan/agent=${AGENT_VERSION}"
          bash .github/scripts/sbom-go.sh desktop "dist/Patronus-Windows-${VERSION}.cdx.json" \
            "github.com/slaynaw/wakeonlan/desktop=${VERSION}" "github.com/slaynaw/wakeonlan/agent=${AGENT_VERSION}"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: true
          cache-disabled: ${{ needs.version.outputs.official == 'true' }}
      - name: Inventaire des composants (application Android)
        run: |
          ./gradlew --stacktrace --init-script .github/scripts/sbom-android.init.gradle.kts :app:cyclonedxDirectBom
          jq -r '"\(.metadata.component.name) \(.metadata.component.version) : \(.components | length) composants"' \
            app/build/reports/sbom/android.cdx.json
          cp app/build/reports/sbom/android.cdx.json "dist/Patronus-${VERSION}-android.cdx.json"
          ls -l dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: dist/
          if-no-files-found: error

  prerelease:
    name: Pré-version de développement
    needs: [version, agent, agent-windows, desktop, desktop-windows, android, deps]
    # Push sur une branche ou lancement manuel sans numéro ; jamais pour une pull request, ni pour
    # Dependabot (jeton en lecture seule). Aucun secret : l'APK garde sa clé de test.
    if: >-
      needs.version.outputs.official != 'true' && startsWith(github.ref, 'refs/heads/') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # pré-version « dev » (Release et tag)
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.name }}
      AGENT_VERSION: ${{ needs.version.outputs.agent }}
      OFFICIAL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Uniquement les fichiers publiés (pas les captures d'écran ni les rapports de test).
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: apk
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agent
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: dist
      - name: Notes de version
        run: bash .github/scripts/release-notes.sh
      - name: Nouveautés
        run: bash .github/scripts/update-manifest.sh
      - name: Publication de la pré-version
        run: |
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev dist/* --prerelease --target "$GITHUB_SHA" \
            --title "Version de développement ${VERSION} (${GITHUB_REF_NAME})" --notes-file notes.md

  release:
    name: Publication officielle
    needs: [version, agent, agent-windows, desktop, desktop-windows, android, deps]
    if: needs.version.outputs.official == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Seul job qui reçoit la clé de signature : l'environnement « publication » attend ta validation
    # (Settings → Environments → publication : Required reviewers) avant de lui remettre ses secrets.
    environment: publication
    permissions:
      contents: write # tag et Release
      id-token: write # attestation de provenance (Sigstore)
      attestations: write # enregistrement des attestations dans le dépôt
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.name }}
      AGENT_VERSION: ${{ needs.version.outputs.agent }}
      OFFICIAL: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Numéro de version libre
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "::error title=Version::La version v$VERSION existe déjà : choisissez un autre numéro."
            exit 1
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: apk
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agent
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: dist
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - name: Signature de l'APK (clé définitive)
        env:
          KEYSTORE_BASE64: ${{ secrets.WOL_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.WOL_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ vars.WOL_KEY_ALIAS }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" ]]; then
            echo "::error title=Signature::Secrets WOL_KEYSTORE_BASE64 / WOL_KEYSTORE_PASSWORD absents (environnement « publication » ou dépôt). Voir docs/SIGNATURE.md."
            exit 1
          fi
          keystore="$RUNNER_TEMP/release.p12"
          trap 'rm -f "$keystore"' EXIT
          # Tolère les espaces / retours à la ligne ajoutés par un copier-coller.
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \t\r\n' | base64 -d > "$keystore"
          apk="dist/Patronus-${VERSION}.apk"
          bash .github/scripts/sign-apk.sh "$apk" "$RUNNER_TEMP/signed.apk" "$keystore" "${KEY_ALIAS:-wakeonlan}"
          mv "$RUNNER_TEMP/signed.apk" "$apk"
      - name: Notes de version
        run: bash .github/scripts/release-notes.sh
      # Manifeste des mises à jour intégrées (nouveautés + empreintes), signé avec la clé de l'APK.
      # Voir docs/MISES-A-JOUR.md.
      - name: Manifeste de mise à jour
        env:
          KEYSTORE_BASE64: ${{ secrets.WOL_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.WOL_KEYSTORE_PASSWORD }}
        run: bash .github/scripts/update-manifest.sh
      # Provenance signée (Sigstore) de chaque fichier publié : dépôt, workflow et commit qui l'ont
      # produit. Vérifiable par tous : gh attestation verify <fichier> --repo slaynAW/Patronus.
      - name: Attestation de provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Release
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Patronus $VERSION" --notes-file notes.md
          else
            # Crée le tag vX.Y.Z sur le commit compilé, puis la Release.
            gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" --title "Patronus $VERSION" --notes-file notes.md
          fi
