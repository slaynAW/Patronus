# Mises à jour des dépendances proposées par Dependabot sous forme de pull requests, une fois par
# mois et regroupées par écosystème. Chaque proposition passe par la CI complète (tests, failles
# connues) avant d'être fusionnée à la main. Délai de 14 jours après la sortie d'une version : une
# version piégée puis retirée n'est jamais proposée. Les correctifs de sécurité (alertes Dependabot)
# ne sont pas retardés.
#
# Non suivis ici : la ligne « toolchain » des go.mod (version de Go, relevée quand govulncheck
# signale une faille de la bibliothèque standard), les outils épinglés dans build.yml (govulncheck,
# cyclonedx-gomod, go-winres) et le greffon de .github/scripts/sbom-android.init.gradle.kts.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directories: ["/agent", "/desktop"]
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      gradle:
        patterns: ["*"]
