org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Version affichée de l'application (le versionCode est calculé par la CI).
wol.versionName=1.1.0

# R8 : règles de conservation « à l'ancienne » (AGP 8). Plusieurs bibliothèques Google (ML Kit,
# Play Services) ont été écrites pour ce comportement ; le mode strict d'AGP 9 casse le lecteur
# de QR code dans l'APK de publication.
android.r8.strictFullModeForKeepRules=false
